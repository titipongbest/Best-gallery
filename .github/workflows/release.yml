name: Release on tag

on:
  push:
    tags:
      - v*
  # manual release: tags `main` (or the selected branch) with `v<pubspec version>`
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  release_github:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Building relies on the Android Gradle plugin,
      # which requires a modern Java version (not the default one).
      - name: Set up JDK for Android Gradle plugin
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Flutter packages
        run: |
          ./flutterw doctor -v
          scripts/apply_flavor_izzy.sh

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      # Requires the `KEY_JKS` (base64 of the .jks file) and `KEYSTORE_PASSWORD` secrets.
      # The key alias is `bestgallery` and the key password is the same as the keystore password.
      - name: Resolve release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: $TAG"

      - name: Build signed APK
        run: |
          if [ -z "$KEY_JKS" ]; then
            echo "Release keystore secrets are missing" >&2
            exit 1
          fi
          NDK_VERSION=28.2.13676358
          export ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export ANDROID_NDK_ROOT=$ANDROID_NDK
          echo "$KEY_JKS" | base64 -d > "$AVES_STORE_FILE"
          export AVES_STORE_PASSWORD="$KEYSTORE_PASSWORD"
          export AVES_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          export AVES_GOOGLE_API_KEY="NONE"
          ./flutterw build apk -t lib/main_izzy.dart --flavor izzy
          mkdir outputs
          cp build/app/outputs/flutter-apk/app-izzy-release.apk "outputs/best-gallery-${RELEASE_TAG}.apk"
          rm -f "$AVES_STORE_FILE"
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AVES_STORE_FILE: ${{ github.workspace }}/key.jks
          AVES_KEY_ALIAS: bestgallery

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "outputs/*"
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          name: "Best gallery ${{ env.RELEASE_TAG }}"
          generateReleaseNotes: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
